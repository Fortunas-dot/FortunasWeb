<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TimeWell — Scroll Check</title>
<meta name="description" content="A 2-minute check on how much of your day the feed takes — and a personal plan to scroll less without deleting your apps." />
<meta name="theme-color" content="#F4F2EC" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script>
/* ============================================================
   CONFIG — everything you fill in lives here. Empty = switched off.
   ============================================================ */
window.TW_FUNNEL = {
  // App Store page. `ct` (campaign token) shows up in App Store Connect →
  // App Analytics → Sources, so you can see installs that came from this funnel.
  // Add your provider token as `pt=` if you want them attributed there.
  appStoreUrl: "https://apps.apple.com/app/id6808209242",
  appStoreCampaign: "web-funnel",

  // PostHog (same project as the app). Public project key, `phc_…`.
  posthogKey: "",
  posthogHost: "https://eu.i.posthog.com",

  // Ad pixels — a LIST per quiz, so one quiz can feed several pixels (one per
  // ad account or campaign). Every event below goes to every pixel listed.
  // Add an id to the list; never replace one that live ads are optimising on.
  // TimeWell dataset in Events Manager (ad account act=2167212431340298 is the
  // account, not a pixel — don't put that number here).
  metaPixelIds: ["3209611159230624"],
  tiktokPixelIds: [],

  // Server-side mirror (Meta Conversions API), same idea as the Aurora funnels:
  // key events are sent from the browser pixel AND posted here with the same
  // event id, so Meta counts them once and still gets them when the pixel is
  // blocked (adblock, iOS). On the Fortunas website this is the Vercel function in
  // FortunasWeb/api/capi.js; it does nothing until META_CAPI_ACCESS_TOKEN is set.
  // Empty = browser pixels only.
  capiEndpoint: "/api/capi",

  // Optional: a URL that accepts POST JSON { email, answers, attribution }.
  // When set, an email step ("send me my plan") appears before the results.
  // When empty, the funnel skips that step entirely — no email is asked for
  // that nothing would receive.
  leadEndpoint: "",
};
</script>

<!-- Click ids + UTMs, captured on landing (the funnel spans many steps and the
     install happens on another site, so they have to outlive the landing URL). -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search);
    var keep = {};
    ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "fbclid", "ttclid", "gclid"].forEach(function (k) {
      var v = q.get(k);
      if (v && v.length <= 500) keep[k] = v;
    });
    // Rebuild _fbc from ?fbclid= when the pixel hasn't set it yet (Safari/iOS,
    // slow or blocked pixel) — the click id is Meta's strongest match signal.
    if (q.get("fbclid") && !/(?:^|;\s*)_fbc=/.test(document.cookie)) {
      document.cookie = "_fbc=fb.1." + Date.now() + "." + q.get("fbclid") + "; path=/; max-age=7776000; SameSite=Lax";
    }
    // TikTok / Google click ids in cookies too, so a server event can read them.
    var ttclid = q.get("ttclid"), gclid = q.get("gclid");
    if (ttclid && ttclid.length >= 8 && ttclid.length <= 500) document.cookie = "tw_ttclid=" + encodeURIComponent(ttclid) + "; path=/; max-age=7776000; SameSite=Lax";
    if (gclid && /^[A-Za-z0-9._~-]{10,200}$/.test(gclid)) document.cookie = "tw_gclid=" + encodeURIComponent(gclid) + "; path=/; max-age=7776000; SameSite=Lax";
    if (Object.keys(keep).length) {
      keep.landed_at = new Date().toISOString();
      localStorage.setItem("tw-funnel-attr", JSON.stringify(keep));
    }
  } catch (e) { /* storage blocked — attribution is best-effort */ }
})();
</script>

<style>
:root {
  --bg: #F4F2EC;
  --surface: #FBFAF6;
  --ink: #26241F;
  --muted: #6B665E;
  --line: #E2DDD0;
  --line-strong: #C9C3B5;
  --accent: #137A3C;
  --accent-dark: #0E5F2E;
  --accent-soft: #D2E7D6;
  --accent-tint: #EAF3EC;
  --clay: #B0492E;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.funnel { overflow-x: clip; min-height: 100dvh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }

/* ---------- header ---------- */
.head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: max(8px, env(safe-area-inset-top)) 20px 0; display: flex; flex-direction: column; gap: 10px; }
.head-row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px; }
.back { width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 12px; }
.back[hidden] { visibility: hidden; display: flex; }
.brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--serif); font-weight: 700; font-size: 18px; letter-spacing: -0.3px; }
.block-row { display: flex; align-items: center; justify-content: space-between; }
.block-name { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.block-dots { display: flex; gap: 5px; }
.block-dots span { width: 6px; height: 6px; border-radius: 999px; background: var(--line); transition: background .3s; }
.block-dots span.on { background: var(--accent); }
.progress { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress .bar { height: 100%; border-radius: 999px; background: var(--accent); transition: width .35s ease; }

/* ---------- screen ---------- */
.screen { flex: 1; display: flex; flex-direction: column; }
.content { flex: 1; padding: 26px 20px 24px; display: flex; flex-direction: column; gap: 22px; }
.content.center { justify-content: center; }
.step-in-right { animation: inR .32s ease both; }
.step-in-left { animation: inL .32s ease both; }
@keyframes inR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .step-in-right, .step-in-left { animation: none; } * { transition: none !important; } }

.titles { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--accent-dark); }
.h1 { font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1.12; letter-spacing: -0.6px; text-wrap: balance; }
.h1.lg { font-size: 32px; }
.sub { font-size: 15px; line-height: 22px; color: var(--muted); text-wrap: pretty; }
.label { font-size: 14px; font-weight: 600; }
.fine { font-size: 12px; line-height: 17px; color: var(--muted); text-align: center; }

/* options */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--line-strong); }
.opt.sel { border-color: var(--accent); background: var(--accent-tint); }
.opt-main { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.opt-label { font-size: 16px; font-weight: 500; }
.opt-desc { font-size: 13px; color: var(--muted); }
.mark { width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid var(--line-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.multi .mark { border-radius: 7px; }
.sel .mark { background: var(--accent); border-color: var(--accent); }
.mark svg { display: none; }
.sel .mark svg { display: block; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.chip.sel { border-color: var(--accent); background: var(--accent-tint); }
.chip .tick { display: none; width: 18px; height: 18px; border-radius: 999px; background: var(--accent); align-items: center; justify-content: center; }
.chip.sel .tick { display: flex; }

.ages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.age { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 156px; padding-bottom: 16px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; overflow: hidden; }
.age:hover { border-color: var(--accent); }
.age.sel { border-color: var(--accent); background: var(--accent-tint); }
.age-faces { display: flex; align-items: center; justify-content: center; padding-top: 4px; }
.age-faces img { width: 76px; height: 76px; border-radius: 999px; object-fit: cover; border: 3px solid var(--surface); background: var(--line); }
.age-faces img + img { margin-left: -18px; }
.age.sel .age-faces img { border-color: var(--accent-tint); }
.age-name { font-size: 17px; font-weight: 600; }

.scale-q { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.18; letter-spacing: -0.5px; text-align: center; text-wrap: balance; }
.scale { display: flex; gap: 8px; }
.scale button { flex: 1; height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-size: 17px; font-weight: 600; cursor: pointer; }
.scale button.sel { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.card { padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.compare { display: flex; flex-direction: column; gap: 12px; }
.compare .card { display: flex; gap: 14px; }
.dot { width: 10px; height: 10px; margin-top: 7px; border-radius: 999px; flex-shrink: 0; }
.card-t { font-family: var(--serif); font-size: 19px; font-weight: 700; }
.card-b { font-size: 15px; line-height: 22px; color: var(--muted); margin-top: 4px; }

.big { display: flex; align-items: baseline; gap: 10px; }
.big-n { font-family: var(--serif); font-weight: 700; font-size: 104px; line-height: .9; letter-spacing: -4px; color: var(--clay); }
.big-u { font-family: var(--serif); font-size: 30px; font-weight: 600; }
.meter { height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter div { height: 100%; background: var(--clay); transition: width .8s ease; }
.meter-legend { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.stat b { font-family: var(--serif); font-size: 24px; white-space: nowrap; font-weight: 700; letter-spacing: -0.8px; }
.stat span { font-size: 12px; line-height: 16px; color: var(--muted); }
.plan { padding: 4px 16px; }
.plan-head { padding: 12px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--accent-dark); }
.plan-row { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.plan-row b { width: 96px; flex-shrink: 0; font-weight: 600; }
.plan-row span { color: var(--muted); line-height: 20px; }

.ring-wrap { position: relative; width: 168px; height: 168px; }
.ring-wrap circle.fg { transition: stroke-dashoffset .2s linear; }
.ring-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 40px; font-weight: 700; }
.checks { display: flex; flex-direction: column; gap: 14px; align-self: stretch; padding: 0 12px; }
.check { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--muted); transition: color .3s; }
.check .mark { width: 22px; height: 22px; }
.check.done { color: var(--ink); }
.check.done .mark { background: var(--accent); border-color: var(--accent); }
.check.done .mark svg { display: block; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field input { height: 56px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font: inherit; font-size: 16px; color: var(--ink); }
.field input:focus { border-color: var(--accent); outline: none; }
.err { font-size: 13px; color: var(--clay); min-height: 18px; }

/* ---------- results page ---------- */
.res-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(10px, env(safe-area-inset-top)) 20px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
.res-bar > span { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.res-bar-btn { height: 38px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: var(--surface); font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none; }
.res-bar-btn:hover { background: var(--accent-dark); color: var(--surface); }
.res { gap: 30px; }
.res section { display: flex; flex-direction: column; gap: 14px; }
.res section.stats { display: grid; }
.foot.static { position: static; background: none; padding-top: 4px; }
.res-hero { gap: 10px !important; }
.accent { color: var(--accent); }
.h2 { font-family: var(--serif); font-weight: 700; font-size: 23px; line-height: 1.2; letter-spacing: -0.4px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pull-n { font-family: var(--serif); font-size: 28px; font-weight: 700; }
.pull-n small { font-size: 15px; color: var(--muted); font-weight: 600; }
.pull-meter { position: relative; height: 12px; border-radius: 999px; background: linear-gradient(90deg, #8DBB98, #C9A13B 55%, #B0492E); margin: 0 11px; }
.pull-dot { position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 999px; background: var(--surface); border: 4px solid var(--ink); transform: translate(-50%, -50%); }
.res .meter-legend { margin-top: 0; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .ax { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.chart .tag { font-family: var(--sans); font-size: 12px; font-weight: 600; }
.chart .tag.now { fill: var(--clay); }
.chart .tag.goal { fill: var(--accent-dark); }
.chart .cline { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.4s ease; }
.chart .carea, .chart .cdot, .chart .tag { opacity: 0; transition: opacity .5s ease; }
.chart .carea, .chart .tag { transition-delay: 1.1s; }
.chart.on .cline { stroke-dashoffset: 0; }
.chart.on .carea, .chart.on .cdot, .chart.on .tag { opacity: 1; }
.xform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 8px; }
.xcard { position: relative; padding: 18px 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
.xcard.after { border: 1.5px solid var(--accent); background: var(--accent-tint); }
.xcard-badge { position: absolute; top: -11px; left: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--surface); font-size: 11px; font-weight: 600; }
.xcard-t { font-family: var(--serif); font-size: 19px; font-weight: 700; margin-bottom: 10px; }
.xcard ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.xcard li { display: flex; gap: 8px; font-size: 13.5px; line-height: 19px; }
.xm { width: 18px; height: 18px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-top: 1px; }
.xm.minus { background: #F1DDD6; color: var(--clay); }
.xm.plus { background: var(--accent); }
.weeks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.weeks li { display: flex; gap: 14px; position: relative; padding-bottom: 18px; }
.weeks li:last-child { padding-bottom: 0; }
.weeks li:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 34px; bottom: 2px; width: 2px; background: var(--line); }
.wk-n { width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-dark); font-family: var(--mono); font-size: 13px; font-weight: 500; }
.weeks li:last-child .wk-n { background: var(--accent); color: var(--surface); }
.weeks b { font-size: 15px; }
.weeks p { font-size: 14px; line-height: 20px; color: var(--muted); margin-top: 2px; }
.spend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.spend .stat:last-child:nth-child(odd) { grid-column: span 2; }
.shots { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 2px 20px 8px; scrollbar-width: none; }
.shots::-webkit-scrollbar { display: none; }
.shots figure { margin: 0; flex: 0 0 62%; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; }
.shots img { width: 100%; height: auto; border-radius: 20px; border: 1px solid var(--line); display: block; }
.shots figcaption { font-size: 13px; line-height: 18px; color: var(--muted); }
.shots figcaption b { display: block; color: var(--ink); font-size: 14px; }
.res .privacy { flex-direction: row; gap: 14px; align-items: flex-start; }
.privacy-ic { width: 40px; height: 40px; border-radius: 999px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.faq { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; padding: 16px 28px 16px 0; font-size: 15px; font-weight: 600; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; position: absolute; right: 2px; top: 13px; font-size: 20px; font-weight: 400; color: var(--muted); }
.faq details[open] summary::after { content: "–"; }
.faq p { font-size: 14px; line-height: 21px; color: var(--muted); padding-bottom: 16px; }

/* ---------- paywall ---------- */
.plan-card { position: relative; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.plan-card.sel { border: 2px solid var(--accent); background: var(--accent-tint); }
.plan-badge { position: absolute; top: -11px; right: 14px; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--surface); font-size: 11px; font-weight: 600; }
.plan-radio { width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid var(--line-strong); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.plan-radio svg { display: none; }
.plan-card.sel .plan-radio { background: var(--accent); border-color: var(--accent); }
.plan-card.sel .plan-radio svg { display: block; }
.plan-name { font-size: 17px; font-weight: 600; }
.plan-price { display: flex; flex-direction: column; align-items: flex-end; }
.plan-price b { font-family: var(--serif); font-size: 22px; letter-spacing: -0.5px; }
.plan-price span { font-size: 12px; color: var(--muted); }
.cmp { padding: 4px 16px 6px; }
.cmp-row { display: grid; grid-template-columns: minmax(0, 1fr) 52px 52px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.cmp-row > :not(:first-child) { justify-self: center; }
.cmp-head { border-top: 0; padding: 12px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
.tick { width: 20px; height: 20px; border-radius: 999px; background: #C9D9CC; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tick.pro { background: var(--accent); }
.nil { width: 10px; height: 2px; border-radius: 2px; background: var(--line-strong); }
.pro-pill { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--accent-tint); border: 1px solid var(--accent-soft); font-size: 14px; }
.field-group { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); }
.sum { display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.sum .muted { font-size: 14px; }
.stripe-mount { min-height: 360px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 8px; }
.stripe-mount .fine { padding: 40px 12px; }
.done-disc { align-self: center; width: 84px; height: 84px; border-radius: 999px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.done-disc svg { display: block; }
.plan .wk-n { width: 30px; height: 30px; }
.card.plan > .plan-row:first-child { border-top: 0; }

/* ---------- footer CTA ---------- */
.foot { position: sticky; bottom: 0; padding: 12px 20px max(24px, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 78%, rgba(244,242,236,0)); display: flex; flex-direction: column; gap: 10px; }
.cta { height: 56px; border: 0; border-radius: 16px; background: var(--accent); color: var(--surface); font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: background .15s; }
.cta:hover { background: var(--accent-dark); color: var(--surface); }
.cta:disabled { background: #BFD5C4; cursor: default; }
.link-btn { border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; height: 40px; cursor: pointer; }
</style>
</head>
<body>
<div class="funnel" id="app"></div>

<script>
(function () {
  "use strict";

  var APPLE = '<svg width="17" height="20" viewBox="0 0 16 19" fill="#FBFAF6" aria-hidden="true"><path d="M13.2 10.1c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.2 2C1.8 9.9 2.9 13.6 4.2 15.6c.6 1 1.4 2.1 2.4 2 .9 0 1.3-.6 2.4-.6s1.4.6 2.4.6c1 0 1.6-1 2.2-2 .7-1.1 1-2.2 1-2.3 0 0-2-.8-2-3.2zM11.3 3.9c.5-.6.9-1.5.8-2.4-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.8-.5 2.3-1.2z"/></svg>';

  /* ============================================================
     The questions. Three blocks, each with its own progress bar.
     ============================================================ */

    { v: "18-29", label: "18–29", mid: 24, file: "18-29" },

    { v: "4-6", label: "4–6 hours", h: 5 },
    { v: "6-8", label: "6–8 hours", h: 7 },

    { v: "counts", label: "Likes and view counts", desc: "Checking how a post is doing" },

    { v: "limits", label: "Screen Time limits", desc: "And tapped “Ignore limit”" },

    { v: "read", label: "Read more" },

    Facebook: "Suggested posts and People You May Know",
  };

    ["Screen time &amp; daily goal", true, true],
    ["Every filter, on every platform", false, true],
    ["No ads, AI content or like counts", false, true],
    ["Focus sessions &amp; Sleep mode", false, true],
    ["App limits &amp; blocking", false, true],
  ];
  function trialEndLabel() {
    // Fixed when the trial starts, so coming back days later still shows the real date.
    var d = new Date(state.answers.trialEnd || Date.now() + PRO.trialDays * 864e5);

  }

  /* ---------- results page content ---------- */

    wake: "Mornings start in the feed",
    work: "Work keeps getting interrupted",
    evening: "Evenings disappear into the feed",

    always: "Reaching for the phone all day",
  };
  var AFTER_WHEN = {
    wake: "Mornings that start on your terms",
    work: "Focus sessions that pause the feeds",
    evening: "Evenings back, apps shut by Sleep mode",
    bed: "Sleep mode shuts the apps overnight",
    always: "Per-app limits and a daily goal",
  };
  var NOW_PULL = {
    short: "Reels and Shorts you never chose",
    feed: "An algorithm deciding what you see",
    counts: "Checking likes and view counts",
    notifs: "Pulled in by every ping",
  };
  var AFTER_PULL = {
    short: "No Reels, no Shorts",
    feed: "Following only — people you chose",
    counts: "No like or view counts",
  };
  // Share of the cut reached by the end of each week (Today, W1–W4).
  var WEEK_CURVE = [0, 0.4, 0.65, 0.85, 1];
  // Plain arithmetic on the hours they would get back.
  var SPEND = {
    read: function (d, y) { return [Math.round(y / 7), "books, at about 7 hours each"]; },
    move: function (d, y) { return [fmtShort(d * 7), "a week to move, train or get outside"]; },
    sleep: function (d, y) { return [fmtShort(Math.min(d, 1.5)), "earlier to bed, every night"]; },
    people: function (d, y) { return [Math.round(y / 3), "evenings out with people"]; },
    project: function (d, y) { return [Math.round(y / 40), "full work weeks for your project"]; },
    focus: function (d, y) { return [Math.round(y / 8), "extra focused workdays"]; },
  };
  var SHOTS = [
    ["shot-browse.jpg", "Browse", "Your apps, with the feeds filtered out."],
    ["shot-filter.jpg", "Filter", "Choose exactly what disappears."],
    ["shot-focus.jpg", "Focus", "Sessions and a nightly sleep window."],
    ["shot-today.jpg", "Today", "Screen time against your daily goal."],
  ];
  var FAQ = [
    ["Is this another app blocker?", "No. Blocking takes the good parts away too, so it rarely lasts. TimeWell removes only the addictive sections — Reels, Shorts, For You, Explore, suggested posts — and keeps your messages, profiles and the people you follow."],

    ["Does it work on Android?", "Not yet. TimeWell is for iPhone."],

  /* Blocks: [from, to] inclusive step indices. */
  var BLOCKS = [
    { name: "You", from: 0, to: 3 },
    { name: "Your habits", from: 4, to: 11 },
    { name: "Your goals", from: 12, to: 13 },
  ];

  /* The step list. `kind` decides the renderer. */
  var STEPS = [
    { id: "age", kind: "age" },
    { id: "hours", kind: "single", key: "hours", eyebrow: "Be honest — nobody's watching", title: "On an average day, how long are you on your phone?", sub: "Not sure? Check Settings → Screen Time.", items: HOURS },
    { id: "apps", kind: "apps" },
    { id: "pulls", kind: "multi", key: "pulls", eyebrow: "Choose all that apply", title: "Which part pulls you in?", items: PULLS },
    { id: "projection", kind: "projection" },
    { id: "agree_auto", kind: "scale", key: "auto" },
    { id: "agree_losttrack", kind: "scale", key: "losttrack" },
    { id: "when", kind: "single", key: "when", eyebrow: "Your pattern", title: "When do you scroll the most?", items: WHEN },
    { id: "trigger", kind: "single", key: "trigger", eyebrow: "Your pattern", title: "What usually starts a scroll?", items: TRIGGERS },
    { id: "agree_worse", kind: "scale", key: "worse" },
    { id: "tried", kind: "multi", key: "tried", eyebrow: "Choose all that apply", title: "What have you tried to cut back?", items: TRIED, exclusive: "none" },

    { id: "email", kind: "email", optional: true },

    { id: "result", kind: "result" },

    { id: "paywall", kind: "paywall" },
    { id: "account", kind: "account" },
    { id: "checkout", kind: "checkout" },
    { id: "trial", kind: "trial" },

  if (!C.leadEndpoint) STEPS = STEPS.filter(function (s) { return s.id !== "email"; });

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ step: state.step, answers: state.answers })); } catch (e) {}

  function attribution() {

     ============================================================ */
  function track(event, props) {

  function genEventId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}

    var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));

  }

  function visitorId() {
    var v = "";
    try { v = localStorage.getItem("tw-funnel-vid") || ""; } catch (e) {}
    if (!v) {
      v = genEventId();
      try { localStorage.setItem("tw-funnel-vid", v); } catch (e) {}
    }
    return v;
  }
  /*
   * One conversion, everywhere at once: the Meta pixel (every id in the config),
   * the TikTok pixel, and the server mirror — all with the SAME event id, which
   * is what lets Meta and TikTok drop the duplicate. Mirrors Aurora's
   * fbqTrack + ttqTrack + sendCapi trio.
   */
  function convert(metaEvent, tiktokEvent, custom, fixedId) {
    var id = fixedId || genEventId();
    custom = custom || {};
    try { if (window.fbq && C.metaPixelIds.length) fbq("track", metaEvent, custom, { eventID: id }); } catch (e) {}
    try {
      if (window.ttq && C.tiktokPixelIds.length && tiktokEvent) {
        ttq.track(tiktokEvent, Object.assign({ contents: [{ content_id: "timewell", content_type: "product", content_name: "TimeWell" }] }, custom), { event_id: id });
      }
    } catch (e) {}
    if (C.capiEndpoint && C.metaPixelIds.length) {
      try {
        fetch(C.capiEndpoint, {
          method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
          body: JSON.stringify({
            event_name: metaEvent, event_id: id, pixel_ids: C.metaPixelIds,
            email: state.answers.accountEmail || state.answers.email || "", external_id: state.answers.accountId || visitorId(),
            fbp: getCookie("_fbp"), fbc: getCookie("_fbc"),
            custom_data: custom, event_source_url: location.href,
          }),
        }).catch(function () {});
      } catch (e) {}
    }
  }
  function trackStep() {
    var s = STEPS[state.step];
    track("funnel_step", { step: s.id, position: state.step, funnel: "scroll-check" });
  }
  // Last step seen when the tab is closed or backgrounded = the drop-off point.
  function onLeave() { track("funnel_leave", { step: STEPS[state.step].id, position: state.step, funnel: "scroll-check" }); }
  window.addEventListener("pagehide", onLeave);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") onLeave(); });

  /* ============================================================
     Navigation
     ============================================================ */
  function go(n) {
    clearTimeout(timer);
    state.dir = n >= state.step ? "right" : "left";
    state.step = Math.max(0, Math.min(n, STEPS.length - 1));
    save();
    render();
    trackStep();
    window.scrollTo(0, 0);
  }
  function next() { go(state.step + 1); }
  function back() {
    var t = state.step - 1;
    if (t === LOADER) t--; // never back into the loader
    go(t);
  }
  function set(key, val) { state.answers[key] = val; save(); }
  // Single-select: show the tick land, then turn the page.
  function pick(key, val) {
    set(key, val);
    render(true);
    clearTimeout(timer);
    timer = setTimeout(next, 260);
  }

  /* ============================================================
     Numbers — everything shown is computed from the answers.
     ============================================================ */
  function find(list, v) { for (var i = 0; i < list.length; i++) if (list[i].v === v) return list[i]; return null; }
  function hoursPerDay() { var h = find(HOURS, state.answers.hours); return h ? h.h : 3; }
  function ageMid() { var a = find(AGES, state.answers.age); return a ? a.mid : 30; }
  function lifetimeYears() { return hoursPerDay() * Math.max(80 - ageMid(), 10) / 24; }
  function targetFrac() { var t = find(TARGET, state.answers.target); return t ? t.f : 0.5; }
  function fmtH(h) {
    var m = Math.round(h * 60), hh = Math.floor(m / 60), mm = m % 60;
    return hh && mm ? hh + " h " + mm + " m" : hh ? hh + " h" : mm + " m";
  }
  // Tight form for the stat tiles, where "1 h 15 m" would wrap.
  function fmtShort(h) {
    var m = Math.round(h * 60), hh = Math.floor(m / 60), mm = m % 60;
    return hh && mm ? hh + "h" + (mm < 10 ? "0" : "") + mm : hh ? hh + "h" : mm + "m";
  }

  function pullScore() {
    var v = ["agree_auto", "agree_losttrack", "agree_worse"].map(function (k) { return state.answers[k]; }).filter(Boolean);
    if (!v.length) return 6;
    return Math.round(v.reduce(function (x, y) { return x + y; }, 0) / v.length * 2);
  }
  // Week-by-week line: Today → Week 4, from their hours down to their goal.
  function chartSvg(wk, h) {
    var W = 320, H = 196, L = 38, R = 18, T = 30, B = 34;
    var top = Math.ceil(h), xs = wk.map(function (_, i) { return L + i * (W - L - R) / (wk.length - 1); });
    var y = function (v) { return T + (1 - v / top) * (H - T - B); };
    var d = "M" + xs[0] + " " + y(wk[0]).toFixed(1);
    for (var i = 1; i < wk.length; i++) {
      var dx = (xs[i] - xs[i - 1]) / 2;

    }
    var area = d + " L " + xs[xs.length - 1] + " " + (H - B) + " L " + xs[0] + " " + (H - B) + " Z";
    var grid = [0, 0.5, 1].map(function (k) {
      var v = top * k, yy = y(v).toFixed(1);
      return '<line x1="' + L + '" y1="' + yy + '" x2="' + (W - R) + '" y2="' + yy + '" stroke="#E2DDD0" stroke-width="1"/>' +
        '<text x="' + (L - 8) + '" y="' + (+yy + 4) + '" text-anchor="end" class="ax">' + (Math.round(v * 10) / 10) + 'h</text>';
    }).join("");
    var labels = ["Today", "Wk 1", "Wk 2", "Wk 3", "Wk 4"].map(function (t, i) { return '<text x="' + xs[i] + '" y="' + (H - 10) + '" text-anchor="middle" class="ax">' + t + '</text>'; }).join("");

        '<div class="card sum"><div class="row-between"><span>Due today</span><b>€0.00</b></div>' +
        '<div class="row-between muted"><span>From ' + trialEndLabel() + '</span><span>' + PRO.priceLabel + ' / month</span></div></div>' +
        '<div id="stripeMount" class="stripe-mount"><p class="fine" id="stripeMsg">Loading secure payment…</p></div>' +
      '</div>';
    },

    /* ---------- trial started ---------- */
    trial: function () {
      var email = state.answers.accountEmail || "your email";
      var steps = [["Download TimeWell", "From the App Store on your iPhone."], ["Sign in with " + esc(email), "Use the password you just chose."], ["Pro unlocks by itself", "Your filters and goal are waiting."]];
      return '<div class="content">' +
        '<div class="done-disc">' + CHECK.replace(/width="13" height="13"/, 'width="40" height="40"') + '</div>' +
        '<div class="titles" style="text-align:center"><h1 class="h1">Your free trial has started</h1><p class="sub">' + PRO.trialDays + ' days of TimeWell Pro, on us. Three steps and you\'re in.</p></div>' +
        '<div class="card plan">' + steps.map(function (st, i) { return '<div class="plan-row"><span class="wk-n">' + (i + 1) + '</span><span style="color:var(--ink)"><b style="width:auto;display:block">' + st[0] + '</b><span class="muted">' + st[1] + '</span></span></div>'; }).join("") + '</div>' +
        '<p class="fine">Trial ends ' + trialEndLabel() + '. Cancel before then and you pay nothing.</p>' +
      '</div>' +
      '<div class="foot"><a class="cta" data-act="trial-download" href="' + esc(storeUrl()) + '">' + APPLE + 'Get TimeWell on the App Store</a></div>';
    },
  };

  function storeUrl() {
    var u = C.appStoreUrl;
    if (C.appStoreCampaign) {
      var a = attribution();
      var ct = C.appStoreCampaign + (a.utm_source ? "-" + a.utm_source : "") + (a.utm_campaign ? "-" + a.utm_campaign : "");
      u += (u.indexOf("?") === -1 ? "?" : "&") + "ct=" + encodeURIComponent(ct.slice(0, 40));
    }
    return u;
  }

  // `quiet` = re-render in place (a selection changed) without the slide-in.
  function render(quiet) {
    var s = STEPS[state.step];
    app.innerHTML = header() +
      '<main class="screen' + (quiet ? "" : " step-in-" + state.dir) + '">' + VIEWS[s.kind](s) + '</main>';
    afterRender(s);
  }

  /* Screen-specific motion: the count-up, the loader. */
  var loaderTimer = null;
  function afterRender(s) {
    clearInterval(loaderTimer);
    if (s.kind !== "checkout") destroyCheckout();
    if (s.kind === "account") {
      document.getElementById("accountForm").addEventListener("submit", function (e) { e.preventDefault(); submitAccount(); });
    }
    if (s.kind === "checkout") mountCheckout();
    if (s.kind === "result" && !state.answers.resultSeen) {
      // Once per visitor: reaching the plan is the quiz's completion event.
      set("resultSeen", true);
      convert("ViewContent", "ViewContent", { content_name: "scroll-check-plan" });
    }
    if (s.kind === "result") {
      var chart = app.querySelector(".chart");
      if (chart) setTimeout(function () { chart.classList.add("on"); }, 120);
    }
    if (s.kind === "projection") {
      var el = app.querySelector("[data-count]"), to = parseFloat(el.dataset.count), t0 = performance.now();
      var bar = app.querySelector("[data-w]");
      requestAnimationFrame(function () { bar.style.width = bar.dataset.w; });
      (function tick(t) {
        var k = Math.min(1, (t - t0) / 900);
        el.textContent = fmt1(to * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(tick);
      })(t0);
    }
    if (s.kind === "loader") {
      var p = 0, ring = document.getElementById("ring"), n = document.getElementById("ringN");
      loaderTimer = setInterval(function () {
        p = Math.min(100, p + (p < 60 ? 2 : p < 90 ? 1.2 : 0.8));
        ring.setAttribute("stroke-dashoffset", (452.4 * (1 - p / 100)).toFixed(1));
        n.textContent = Math.round(p) + "%";
        for (var i = 0; i < 3; i++) if (p >= (i + 1) * 33) document.getElementById("chk" + i).classList.add("done");
        if (p >= 100) { clearInterval(loaderTimer); setTimeout(next, 450); }
      }, 50);
    }
    if (s.kind === "email") {
      var f = document.getElementById("emailForm");
      f.addEventListener("submit", function (e) { e.preventDefault(); submitEmail(); });
    }
  }

  function submitEmail() {
    var input = document.getElementById("email"), err = document.getElementById("emailErr");
    var v = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { err.textContent = "That doesn't look like an email address."; input.focus(); return; }
    set("email", v);
    track("funnel_lead", { funnel: "scroll-check" });
    convert("Lead", "SubmitForm", { content_name: "scroll-check" });
    try {
      fetch(C.leadEndpoint, {
        method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
        body: JSON.stringify({ email: v, answers: state.answers, attribution: attribution(), funnel: "scroll-check" }),
      }).catch(function () {});
    } catch (e) {}
    next();
  }

  /* ---------- Pro: account → Stripe → trial (Aurora's web checkout) ---------- */
  function postJson(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, json: j }; }); });
  }

  function submitAccount() {
    var email = document.getElementById("acEmail").value.trim();
    var pass = document.getElementById("acPass").value;
    var err = document.getElementById("acErr"), btn = document.getElementById("acBtn");
    err.textContent = "";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = "That doesn't look like an email address."; return; }
    if (pass.length < 8) { err.textContent = "Use at least 8 characters for your password."; return; }
    btn.disabled = true; btn.textContent = "Creating your account…";
    postJson("/api/timewell/register", { email: email, password: pass }).then(function (r) {
      if (!r.ok || !r.json.account) throw new Error(r.json.error || "Could not create your account.");
      set("accountId", r.json.account.id);
      set("accountEmail", r.json.account.email);
      track("funnel_account_created", { funnel: "scroll-check" });
      // Aurora fires CompleteRegistration when the account is made (pixel + CAPI).
      convert("CompleteRegistration", "CompleteRegistration", { content_name: "timewell-pro" });
      next();
    }).catch(function (e) {
      err.textContent = e.message || "Could not create your account.";
      btn.disabled = false; btn.textContent = "Continue to payment";
    });
  }

  var embedded = null;
  function destroyCheckout() {
    if (embedded) { try { embedded.destroy(); } catch (e) {} embedded = null; }
  }
  function loadStripeJs() {
    if (window.Stripe) return Promise.resolve(window.Stripe);
    return new Promise(function (resolve, reject) {
      var sc = document.createElement("script");
      sc.src = "https://js.stripe.com/v3/";
      sc.onload = function () { resolve(window.Stripe); };
      sc.onerror = function () { reject(new Error("Could not load the payment form.")); };
      document.head.appendChild(sc);
    });
  }
  function mountCheckout() {
    var msg = document.getElementById("stripeMsg");
    var a = state.answers;
    if (!a.accountId) { go(STEPS.findIndex(function (x) { return x.kind === "account"; })); return; }
    destroyCheckout();
    var sessionId = "";
    postJson("/api/timewell/checkout", {
      userId: a.accountId, email: a.accountEmail, pixel_ids: C.metaPixelIds,
      fbp: getCookie("_fbp"), fbc: getCookie("_fbc"), event_source_url: location.href,
    }).then(function (r) {
      if (!r.ok || !r.json.clientSecret) throw new Error(r.json.error || "Could not start checkout.");
      sessionId = r.json.sessionId;
      set("stripeLive", r.json.live === true);
      var pk = r.json.publishableKey;
      return loadStripeJs().then(function (Stripe) {
        return Stripe(pk).initEmbeddedCheckout({
          clientSecret: r.json.clientSecret,
          // Payments without a 3-D Secure redirect finish here, in the page.
          onComplete: function () { trialStarted(sessionId); },
        });
      });
    }).then(function (ec) {
      if (STEPS[state.step].kind !== "checkout") { try { ec.destroy(); } catch (e) {} return; }
      embedded = ec;
      if (msg) msg.remove();
      ec.mount("#stripeMount");
    }).catch(function (e) {
      if (msg) msg.textContent = e.message || "Could not start checkout.";
    });
  }

  // StartTrial — browser pixel + CAPI with id trial_<session>, the same id the
  // Stripe webhook uses, so Meta counts the trial once (Aurora's fireCheckoutSuccess).
  function trialStarted(sessionId) {
    if (sessionId && state.answers.trialSession === sessionId) { go(STEPS.findIndex(function (x) { return x.kind === "trial"; })); return; }
    set("trialSession", sessionId || "");
    set("trialEnd", Date.now() + PRO.trialDays * 864e5);
    track("funnel_trial_started", { funnel: "scroll-check", live: state.answers.stripeLive === true });
    // A sandbox checkout (test keys, card 4242…) must not reach the real pixel.
    if (state.answers.stripeLive === true) convert("StartTrial", "StartTrial", { value: 0, currency: "EUR", predicted_ltv: +(PRO.price * 3).toFixed(2) }, sessionId ? "trial_" + sessionId : "");
    destroyCheckout();
    go(STEPS.findIndex(function (x) { return x.kind === "trial"; }));
  }

  /* One delegated click handler for every button on every screen. */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var act = b.dataset.act, key = b.dataset.key, v = b.dataset.v;
    var s = STEPS[state.step];
    if (act === "back") back();
    else if (act === "next") next();
    else if (act === "pick") {
      if (state.step === 0 && !state.answers.started) { set("started", true); track("funnel_started", { funnel: "scroll-check" }); if (window.fbq) fbq("trackCustom", "QuizStarted", { funnel: "scroll-check" }); }
      pick(key, v);
    }
    else if (act === "scale") pick(key, parseInt(v, 10));
    else if (act === "toggle") {
      var list = listOf(key).slice(), i = list.indexOf(v);
      if (i === -1) {
        // An "exclusive" option ("Nothing yet") clears the others, and vice versa.
        if (s.exclusive === v) list = [];
        else if (s.exclusive) list = list.filter(function (x) { return x !== s.exclusive; });
        list.push(v);
      } else list.splice(i, 1);
      set(key, list);
      render(true);
    }
    else if (act === "email") submitEmail();
    else if (act === "to-paywall") {
      next();
    }
    else if (act === "plan") {
      set("plan", v);
      render(true);
    }
    else if (act === "choose-pro") {
      set("plan", "pro");
      track("funnel_choose_pro", { funnel: "scroll-check" });
      convert("InitiateCheckout", "ClickButton", { content_name: "timewell-pro", value: PRO.price, currency: "EUR" });
      next();
    }
    else if (act === "choose-free") {
      track("funnel_choose_free", { funnel: "scroll-check" });
      try { if (window.fbq && C.metaPixelIds.length) fbq("trackCustom", "ChoseFree", { content_name: "timewell-free" }); } catch (e2) {}
      // The App Store opens via the link itself.
    }
    else if (act === "account") submitAccount();
    else if (act === "trial-download") {
      track("funnel_download_click", { funnel: "scroll-check", plan: "pro" });
    }
    else if (act === "download") {
      track("funnel_download_click", { funnel: "scroll-check", hours: state.answers.hours, target: state.answers.target });
      // The App Store button is this funnel's checkout step (the subscription
      // is bought in the app), so it fires InitiateCheckout — the same event the
      // Aurora paywall CTA sends. keepalive lets it outlive the page change.
      convert("InitiateCheckout", "ClickButton", { content_name: "timewell-app-store" });
    }
    else if (act === "restart") {
      state.answers = {};
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      go(0);
    }
  });

  // A card that needed 3-D Secure leaves the page and comes back here.
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("checkout") === "success") {
        history.replaceState({}, "", location.pathname);
        trialStarted(q.get("session_id") || "");
        return;
      }
    } catch (e) {}
    render();
    trackStep();
  })();
})();
</script>
</body>
</html>
